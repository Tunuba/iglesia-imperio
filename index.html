<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060B">
<title>Tu corazón — El catolicismo For Dummies</title>
<meta name="description" content="Acompañamiento en el teléfono para la presentación sobre el cristianismo católico en el Imperio romano. Claves del Pensamiento 1, Universidad del Istmo.">
<style>
:root{
  --noche:#05060B; --piedra:#151926; --linea:#2A3145;
  --tinta:#FFF6E2; --tinta2:#C8C4B6; --apagado:#8A8674;
  --oro:#E8C44A; --oro2:#F5DE93; --sangre:#C0261E; --verde:#3E8E4A;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
  --ease:cubic-bezier(.22,.68,.28,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--noche);color:var(--tinta);font-family:var(--sans);
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-font-smoothing:antialiased}

#app{position:fixed;inset:0;display:flex;flex-direction:column;height:100dvh}
#cielo{position:absolute;inset:0;z-index:0;transition:background 1s var(--ease)}
#destello{position:absolute;inset:0;z-index:9;pointer-events:none;background:#FFF6E2;opacity:0}
/* brasas: polvo que sube despacio y toma el color del cielo de cada momento.
   Da vida al fondo sin agregar una sola palabra. */
#brasas{position:absolute;inset:0;z-index:1;pointer-events:none}
#vineta{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 92% 74% at 50% 44%,transparent 46%,rgba(0,0,0,.7) 100%)}

header{position:relative;z-index:10;display:flex;align-items:center;gap:9px;flex:0 0 auto;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 4px}
.luzSala{width:7px;height:7px;border-radius:50%;background:#2A3145;flex:0 0 auto;transition:background .4s}
.luzSala.ok{background:var(--verde);box-shadow:0 0 8px var(--verde)}
.luzSala.busca{background:var(--oro);opacity:.5}
.marca{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--apagado);
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:1;transition:opacity .8s var(--ease)}
/* el nombre del curso se ve al entrar y despues se apaga: cuanto menos letra
   haya en el telefono, mas mira la clase la pantalla grande */
body.calla .marca{opacity:0}
.pasos{margin-left:auto;display:flex;gap:3px;flex:0 0 auto}
.pip{width:7px;height:3px;border-radius:2px;background:#222939;transition:background .4s}
.pip.on{background:var(--oro)} .pip.done{background:#6A5A28}

/* ── EL CORAZÓN es el protagonista de esta pantalla ── */
main{position:relative;z-index:10;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(8px,2vh,18px);padding:0 20px}
#latido{flex:0 0 auto;display:block;image-rendering:pixelated;touch-action:none}
/* el personaje se presenta y se retira: aparece cuando el corazon es "tuyo",
   cuando te toca elegir y al final. En el resto, el corazon manda solo. */
#quien{text-align:center;flex:0 0 auto;opacity:0;transform:translateY(9px);
  transition:opacity .7s var(--ease),transform .7s var(--ease)}
#quien.on{opacity:1;transform:none}
#quien .nom{font-family:var(--serif);font-size:clamp(17px,5vw,24px);line-height:1.15}
#quien .sub{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--apagado);
  text-transform:uppercase;margin-top:5px}
#dice{font-family:var(--mono);font-size:clamp(10.5px,3vw,13px);letter-spacing:.14em;
  text-transform:uppercase;color:var(--oro2);text-align:center;flex:0 0 auto;min-height:1.4em;
  line-height:1.5;transition:color .6s var(--ease),opacity .6s var(--ease)}
/* cuando no hay nada que tocar, la indicacion se apaga a un susurro */
#dice.mira{color:var(--apagado);opacity:.62}
@keyframes lat{0%,100%{opacity:.4}50%{opacity:1}}
.lat{animation:lat 1.6s ease-in-out infinite}

/* la barra de la sala, sólo en el momento de la luz */
#barraSala{width:100%;max-width:420px;height:26px;border:1px solid var(--linea);border-radius:9px;
  background:#0C1018;overflow:hidden;position:relative;display:none;flex:0 0 auto}
#barraSala.on{display:block}
#barraSala i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#B8912A,#F5DE93);
  transition:width .3s ease}
#barraSala span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
#barraSala i{box-shadow:0 0 22px rgba(245,222,147,.55)}

/* el pedazo del Credo */
#pedazo{border:1px solid #4A3C14;border-radius:13px;padding:12px 15px;flex:0 0 auto;width:100%;
  max-width:460px;background:linear-gradient(180deg,rgba(40,33,12,.95),rgba(20,17,8,.95));display:none}
#pedazo.on{display:block}
#pedazo .n{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--oro);text-transform:uppercase}
#pedazo .frase{font-family:var(--serif);font-size:clamp(19px,5.6vw,27px);line-height:1.15;
  color:var(--oro2);margin-top:7px}

footer{position:relative;z-index:10;flex:0 0 auto;display:flex;flex-direction:column;gap:8px;
  padding:6px 16px calc(env(safe-area-inset-bottom) + 12px)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.btn{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding:15px 16px;border:1px solid var(--linea);border-radius:13px;background:var(--piedra);
  font-size:15px;font-weight:600;transition:transform .12s var(--ease),border-color .3s}
.btn:active{transform:scale(.975)}
.btn.oro{border-color:var(--oro);background:linear-gradient(180deg,#231D0C,#171308);color:var(--oro2)}
.btn.sangre{border-color:#5A211C;background:linear-gradient(180deg,#241110,#180B0A)}
.btn .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--apagado);
  text-transform:uppercase;margin-left:8px}
.btn .relleno{position:absolute;left:0;top:0;bottom:0;width:0%;
  background:linear-gradient(90deg,rgba(232,196,74,.32),rgba(255,244,200,.16));pointer-events:none}
.btn .rotulo{position:relative;z-index:1}
#acciones{display:flex;flex-direction:column;gap:10px}
/* los botones llaman: respiran despacio hasta que se tocan */
@keyframes respira{0%,100%{box-shadow:0 0 0 0 rgba(232,196,74,0)}
  50%{box-shadow:0 0 26px 0 rgba(232,196,74,.30)}}
.btn{animation:respira 2.8s var(--ease) infinite}
.btn.sangre{animation-name:respiraS}
@keyframes respiraS{0%,100%{box-shadow:0 0 0 0 rgba(192,38,30,0)}
  50%{box-shadow:0 0 26px 0 rgba(192,38,30,.34)}}
.btn.grande{padding:19px 16px;font-size:17px;flex-direction:column;gap:3px}
.btn.grande .k{margin-left:0}

/* el aviso de "es tuyo" */
#tuyo{position:fixed;inset:0;z-index:30;display:none;place-items:center;text-align:center;
  padding:8vw 7vw;background:radial-gradient(ellipse 90% 70% at 50% 42%,#3A2C08 0%,#05060B 78%)}
#tuyo.on{display:grid;animation:entra .45s var(--ease)}
#tuyo::before{content:"";position:absolute;inset:-40%;z-index:-1;opacity:.30;
  /* rayos apenas insinuados: si se ven "a propósito" parecen calcomanía */
  background:repeating-conic-gradient(from 0deg,rgba(245,222,147,.10) 0deg 3deg,transparent 3deg 17deg);
  mask-image:radial-gradient(circle at 50% 50%,#000 12%,transparent 62%);
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 12%,transparent 62%);
  animation:gira 40s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes entra{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
#tuyo .n{font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;color:var(--oro);text-transform:uppercase}
#tuyo .frase{font-family:var(--serif);font-size:clamp(26px,8vw,48px);line-height:1.14;color:var(--oro2);margin-top:16px}
#tuyo .pie{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--tinta);margin-top:20px}
</style>
</head>
<body>
<div id="app">
  <div id="cielo"></div>
  <canvas id="brasas"></canvas>

  <header>
    <span class="luzSala" id="luzSala"></span>
    <div class="marca">Claves del Pensamiento 1 · UNIS</div>
    <div class="pasos" id="pasos"></div>
  </header>

  <main>
    <canvas id="latido"></canvas>
    <div id="quien">
      <div class="nom" id="perNombre">—</div>
      <div class="sub" id="perLugar">—</div>
    </div>
    <div id="barraSala"><i id="barraLlena"></i><span id="barraTxt">la luz de la sala · 0%</span></div>
    <div id="pedazo">
      <div class="n" id="pedN">Pedazo — de —</div>
      <div class="frase" id="pedTxt">—</div>
    </div>
    <div id="dice" class="lat">mirá la pantalla grande</div>
  </main>

  <footer>
    <div id="acciones"></div>
  </footer>

  <div id="vineta"></div>
  <div id="destello"></div>
</div>

<div id="tuyo">
  <div>
    <div class="n" id="tuyoN">Pedazo — de —</div>
    <div class="frase" id="tuyoTxt">—</div>
    <div class="pie">ES TUYO · LEVANTÁ EL TELÉFONO</div>
  </div>
</div>

<script src="assets/sprites.js?v=6"></script>
<script src="assets/escenas.js?v=6"></script>
<script src="assets/sala.js?v=6"></script>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   EL TELÉFONO — acompañamiento, no la presentación.

   La presentación es la pantalla grande. Acá cada quien tiene tres cosas
   suyas: su personaje, su corazón (que late, se ennegrece y se purifica)
   y su pedazo del Credo. Y toca cuando le toca.

   Nada de párrafos a propósito: si hubiera texto, la clase leería el
   teléfono en vez de mirar y escuchar.
   ═══════════════════════════════════════════════════════════════════ */
const $=(s)=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

const CREDO=[
  "Creo en un solo Dios,","Padre todopoderoso,","Creador del cielo y de la tierra,",
  "de todo lo visible y lo invisible.","Creo en un solo Señor, Jesucristo,",
  "Hijo único de Dios,","Dios de Dios, Luz de Luz,","engendrado, no creado,",
  "de la misma naturaleza del Padre;","que por nosotros bajó del cielo","y se hizo hombre;",
  "padeció y fue sepultado,","y resucitó al tercer día.",
  "Creo en el Espíritu Santo, Señor y dador de vida.",
  "Creo en la Iglesia, que es una, santa, católica y apostólica.",
  "Confieso que hay un solo bautismo para el perdón de los pecados."
];
const TOTAL=13;

/* ── quién sos ──────────────────────────────────────────────────── */
const LS="catolicismo-tel-v1";
let S={ persona:0, pedazo:0, voto:null, escena:0 };
try{ const g=JSON.parse(localStorage.getItem(LS)||"null");
     if(g&&typeof g.persona==="number") S=Object.assign(S,g); else sorteo();
}catch(e){ sorteo(); }
function sorteo(){
  S.persona=Math.floor(Math.random()*window.SPRITES.catalogo.length);
  S.pedazo=Math.floor(Math.random()*CREDO.length);
  S.voto=null;
}
function guardar(){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }

/* ── vibrar: el teléfono contesta al dedo ───────────────────────── */
function vibra(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* ── las brasas del fondo ───────────────────────────────────────────
   Polvo que sube despacio, del color del cielo de cada momento. Al tocar
   el corazón salen chispas desde el centro. Es todo lo "bonito" que se
   puede agregar sin escribir una palabra más. */
const TINTES={ vacio:[126,146,204], calido:[150,172,224], oscuro:[128,96,150],
  luz:[245,222,147], sangre:[204,96,84], oro:[240,205,110], templo:[142,174,232] };
let tinte=TINTES.vacio, motas=[];
function nuevaMota(x,y,chispa){
  return { x:x, y:y, vx:(Math.random()-0.5)*(chispa?1.9:0.22),
           vy:chispa?-(0.9+Math.random()*2.2):-(0.10+Math.random()*0.28),
           r:(chispa?1.4:0.9)+Math.random()*1.7, vida:chispa?1:1,
           chispa:!!chispa };
}
function chispea(n,color){
  const cv=document.getElementById("latido"); if(!cv) return;
  const r=cv.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, d=r.width*(0.12+Math.random()*0.22);
    const m=nuevaMota(cx+Math.cos(a)*d, cy+Math.sin(a)*d, true);
    if(color) m.color=color;
    motas.push(m);
  }
}
function pintaBrasas(){
  const cv=document.getElementById("brasas"); if(!cv) return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.round(innerWidth*dpr), h=Math.round(innerHeight*dpr);
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h;
    cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px"; }
  const ctx=cv.getContext("2d");
  ctx.clearRect(0,0,w,h);
  while(motas.length<34) motas.push(nuevaMota(Math.random()*innerWidth, innerHeight*(0.4+Math.random()*0.75), false));
  for(let i=motas.length-1;i>=0;i--){
    const m=motas[i];
    m.x+=m.vx; m.y+=m.vy;
    if(m.chispa){ m.vy+=0.035; m.vida-=0.016; if(m.vida<=0){ motas.splice(i,1); continue; } }
    else if(m.y<-10||m.x<-10||m.x>innerWidth+10){ motas[i]=nuevaMota(Math.random()*innerWidth, innerHeight+8, false); continue; }
    const c=m.color||tinte;
    const op=(m.chispa?m.vida*0.85:0.13+0.16*Math.sin((m.y+m.x)/70))*(0.6+0.4*luz);
    ctx.fillStyle="rgba("+c[0]+","+c[1]+","+c[2]+","+Math.max(0,op).toFixed(3)+")";
    ctx.beginPath(); ctx.arc(m.x*dpr,m.y*dpr,m.r*dpr,0,6.2832); ctx.fill();
  }
}

/* ── el corazón, que es lo que se mira acá ──────────────────────── */
let negrura=0, luz=0, luzSala=0;
function pintaLatido(){
  requestAnimationFrame(pintaLatido);
  const cv=$("#latido");
  if(!window.Escenas || !Escenas.listo()) return;
  const alto=Math.max(110, Math.min(innerHeight*0.40, innerWidth*0.74));
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  const lado=Math.round(alto*dpr);
  if(cv.width!==lado){ cv.width=lado; cv.height=lado; }
  cv.style.width=alto+"px"; cv.style.height=alto+"px";
  const ctx=cv.getContext("2d");
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,lado,lado);
  const t=performance.now()/1000;
  const SP=Escenas.sprites();
  const fr=Math.floor((t*(11+7*luz))%SP.corazon.n);
  let img;
  if(luz>0) img=Escenas.corazonMezcla(fr,"negro","oro",luz);
  else if(negrura>0) img=Escenas.corazonMezcla(fr,"vivo","negro",negrura);
  else img=Escenas.corazon(fr,"vivo");
  // resplandor detrás: si no, el corazón negro sobre fondo negro no se ve
  const g=ctx.createRadialGradient(lado/2,lado/2,lado*0.12,lado/2,lado/2,lado*0.52);
  g.addColorStop(0,"rgba(255,244,200,"+(0.10+0.26*luz+0.05*Math.sin(t*2))+")");
  g.addColorStop(1,"rgba(255,244,200,0)");
  ctx.fillStyle=g; ctx.fillRect(0,0,lado,lado);
  ctx.drawImage(img,0,0,lado,lado);
  // el anillo: lo cargado se ve ALREDEDOR del corazón, no en un número
  if(anillo){
    const R=lado*0.365, gr=-Math.PI/2;   // el sprite deja aire: mas afuera, el anillo se despega del corazon
    ctx.lineCap="round";
    ctx.strokeStyle="rgba(255,246,226,.10)"; ctx.lineWidth=lado*0.020;
    ctx.beginPath(); ctx.arc(lado/2,lado/2,R,0,6.2832); ctx.stroke();
    if(luz>0){
      ctx.strokeStyle="rgba(245,222,147,"+(0.55+0.4*luz).toFixed(2)+")";
      ctx.lineWidth=lado*0.026;
      ctx.beginPath(); ctx.arc(lado/2,lado/2,R,gr,gr+6.2832*luz); ctx.stroke();
    }
  }
  pintaBrasas();
}
// el anillo sólo existe en el momento de la luz
let anillo=false;

/* ── lo que hace el teléfono en cada momento ────────────────────── */
const MOMENTOS=[
  {dice:"mirá la pantalla grande", cielo:"vacio"},
  {dice:"este corazón es el tuyo", cielo:"calido"},
  {dice:"tocá para apagarlo", cielo:"oscuro", accion:"pecado"},
  {dice:"sostené para cargar la luz", cielo:"luz", accion:"luz", barra:true},
  {dice:"mirá la pantalla grande", cielo:"oscuro"},
  {dice:"mirá la pantalla grande", cielo:"templo"},
  {dice:"mirá la pantalla grande", cielo:"templo"},
  {dice:"mirá la pantalla grande", cielo:"calido"},
  {dice:"elegí", cielo:"sangre", accion:"voto"},
  {dice:"de prohibidos a permitidos", cielo:"oro"},
  {dice:"de permitidos a ser el imperio", cielo:"oro"},
  {dice:"mirá la pantalla grande", cielo:"calido"},
  {dice:"cuando escuches tu pedazo, levantá el teléfono", cielo:"oro", pedazo:true}
];

(function pips(){ const c=$("#pasos");
  for(let i=0;i<TOTAL;i++){ const d=document.createElement("div"); d.className="pip"; c.appendChild(d);} })();

function ir(n){
  n=clamp(n,0,TOTAL-1);
  S.escena=n; guardar();
  const m=MOMENTOS[n];
  $("#dice").textContent=m.dice;
  $("#dice").className="lat"+(m.accion?"":" mira");
  $("#pedazo").className=m.pedazo?"on":"";
  $("#barraSala").className=m.barra?"on":"";
  anillo=(m.accion==="luz");
  tinte=TINTES[m.cielo]||TINTES.vacio;
  // el personaje se presenta cuando el corazón pasa a ser "tuyo", vuelve
  // cuando te toca elegir y se queda al final. En el resto, estorba.
  $("#quien").className=(n===1||n===8||n===TOTAL-1)?"on":"";
  document.body.classList.toggle("calla",n>0);
  if(window.Escenas) Escenas.cielo(m.cielo);
  Array.from($("#pasos").children).forEach((p,i)=>{
    p.className="pip"+(i<n?" done":(i===n?" on":""));
  });
  if(n<2){ negrura=0; luz=0; listoLuz=false; }
  pintaAcciones(m.accion);
}
/* El corazón es tocable: en el momento del pecado se apaga tocándolo, y en
   el de la luz se carga manteniendo el dedo encima. El botón de abajo sigue
   estando (es el que dice QUÉ hacer); esto es para que la mano vaya al
   corazón, que es lo que se mira. */
(function corazonTocable(){
  const cv=document.getElementById("latido");
  let dentro=false;
  cv.addEventListener("pointerdown",(e)=>{
    if(e.cancelable) e.preventDefault();
    const m=MOMENTOS[S.escena]||{};
    if(m.accion==="pecado"&&negrura<1){ apagaCorazon(); return; }
    if(m.accion==="luz"&&!listoLuz){ dentro=true; sostener(true); return; }
    chispea(7); vibra(8);            // en cualquier otro momento: sólo late
  });
  const suelta=()=>{ if(dentro){ dentro=false; sostener(false); } };
  addEventListener("pointerup",suelta);
  addEventListener("pointercancel",suelta);
})();
window.__ir=ir;
window.__escena=()=>S.escena;
window.__avisa=(i)=>avisaPedazo(i);   // para las fotos y las pruebas
window.__estado=()=>({persona:S.persona,pedazo:S.pedazo,voto:S.voto,luz:luz,luzSala:luzSala,negrura:negrura,listoLuz:listoLuz});

/* ── las acciones, una por momento ──────────────────────────────── */
let sostiene=false, listoLuz=false;
function boton(txt,clase){
  const b=document.createElement("button");
  b.className="btn"+(clase?" "+clase:""); b.textContent=txt;
  return b;
}
function pintaAcciones(cual){
  const c=$("#acciones");
  c.innerHTML="";
  if(cual==="pecado"&&negrura<1){
    const b=boton("TOCÁ PARA APAGARLO","sangre");
    b.onclick=apagaCorazon;
    c.appendChild(b);
  }
  if(cual==="luz"&&!listoLuz){
    const b=boton("","oro");
    b.innerHTML='<span class="relleno" id="relleno"></span><span class="rotulo">MANTENÉ EL DEDO AQUÍ</span>';
    const on=(e)=>{ if(listoLuz) return; if(e&&e.cancelable) e.preventDefault(); sostener(true); };
    const off=()=>{ sostener(false); };
    b.addEventListener("touchstart",on,{passive:false});
    b.addEventListener("touchend",off); b.addEventListener("touchcancel",off);
    b.addEventListener("mousedown",on); addEventListener("mouseup",off);
    c.appendChild(b);
  }
  if(cual==="voto"&&!S.voto){
    const a=boton("ADORAR AL EMPERADOR","grande"), b=boton("MANTENER MI FE","sangre grande");
    a.id="bEmperador"; b.id="bFe";     // con nombre, para poder probarlos
    a.innerHTML+='<span class="k">vivís</span>'; b.innerHTML+='<span class="k">no vivís</span>';
    a.onclick=()=>vota("emperador"); b.onclick=()=>vota("fe");
    c.appendChild(a); c.appendChild(b);
  }
}
/* apagar el corazón: es el momento del pecado, y tiene que SENTIRSE */
function apagaCorazon(){
  if(negrura>=1) return;
  animar(v=>negrura=v,1,1500);
  chispea(26,[90,80,74]);            // ceniza
  vibra([28,50,120]);
  $("#dice").textContent="se apagó";
  pintaAcciones(null);
}
/* sostener: el dedo puede estar en el botón o en el corazón, da igual */
function sostener(v){
  if(listoLuz) return;
  if(v&&!sostiene) vibra(10);
  sostiene=!!v;
}
function animar(set,hasta,ms){
  const t0=performance.now(), desde=(hasta===1?0:1);
  (function paso(){
    const k=clamp((performance.now()-t0)/ms,0,1);
    set(desde+(hasta-desde)*(1-Math.pow(1-k,3)));
    if(k<1) requestAnimationFrame(paso);
  })();
}
function vota(cual){
  S.voto=cual; guardar();
  chispea(24, cual==="fe"?[245,222,147]:[204,96,84]);
  vibra(cual==="fe"?[30,40,30,40,180]:[120]);
  $("#dice").textContent = cual==="fe" ? "te llamaron mártir" : "te llamaron lapsi, «caído»";
  pintaAcciones("voto");
  if(canal) canal.enviar({t:"voto",id:idTelefono,v:cual});
}

/* ── la sala ────────────────────────────────────────────────────── */
let canal=null, ultimaSalaLuz=0, ultimaEscena=-1, huboCaida=false;
const idTelefono=(function(){
  let v=null; try{ v=localStorage.getItem("imperio-id"); }catch(e){}
  if(!v){ v=Math.random().toString(36).slice(2,10); try{ localStorage.setItem("imperio-id",v); }catch(e){} }
  return v;
})();

/* ── cargar la luz: por tiempo real, no por temporizadores (el
      navegador los estrangula cuando la pantalla no está al frente) ── */
(function carga(){
  const SUBE=0.42, BAJA=0.20;
  let tPrev=performance.now(), ultimoAviso=0;
  function tick(dt){
    if(listoLuz) return;
    luz=clamp(luz+(sostiene?SUBE:-BAJA)*dt,0,1);
    const r=document.getElementById("relleno");
    if(r) r.style.width=(luz*100).toFixed(1)+"%";
    // sin canal (o si la computadora no informa en 6 s) la barra sigue a la
    // tuya: nadie se queda trabado esperando a un salón que no contesta
    const mudo=!canal||(ultimaSalaLuz===0||Date.now()-ultimaSalaLuz>6000);
    if(mudo) luzSala=Math.max(luzSala,luz);
    $("#barraLlena").style.width=(luzSala*100).toFixed(1)+"%";
    $("#barraTxt").textContent="la luz de la sala · "+Math.round(luzSala*100)+"%";
    const ms=Date.now();
    if(canal&&ms-ultimoAviso>700){ ultimoAviso=ms; canal.enviar({t:"luz",id:idTelefono,p:+luz.toFixed(2)}); }
    if(luz>=1&&luzSala>=0.6){
      listoLuz=true; negrura=0; anillo=false;
      chispea(40,[255,244,200]); vibra([40,40,40,40,160]);
      $("#dice").textContent="limpio";
      if(window.Escenas) Escenas.destello(800);
      pintaAcciones(null);
    }else if(luz>=1){
      $("#dice").textContent="esperando al resto del salón…";
    }
  }
  window.__paso=tick;
  window.__sostiene=(v)=>{ sostiene=!!v; };
  (function marco(ahora){
    requestAnimationFrame(marco);
    const dt=Math.min(0.25,(ahora-tPrev)/1000); tPrev=ahora;
    tick(dt);
  })(performance.now());
})();

function codigoDelEnlace(){
  const m=(location.hash+location.search).match(/[?#&]s=([a-zA-Z0-9_-]{1,24})/);
  if(m){ try{ localStorage.setItem("imperio-sala",m[1]); }catch(e){} return m[1]; }
  return null;
}
function saluda(){ if(canal) canal.enviar({t:"hola",id:idTelefono,p:S.persona,f:S.pedazo}); }
function avisaPedazo(i){
  if(i!==S.pedazo) return;
  $("#tuyoN").textContent="Pedazo "+(i+1)+" de "+CREDO.length;
  $("#tuyoTxt").textContent=CREDO[i];
  $("#tuyo").classList.add("on");
  vibra([90,60,90,60,220]);
  chispea(48,[245,222,147]);
  if(canal) canal.enviar({t:"arriba",id:idTelefono});
  clearTimeout(avisaPedazo.t);
  avisaPedazo.t=setTimeout(()=>$("#tuyo").classList.remove("on"),14000);
}
$("#tuyo").onclick=()=>$("#tuyo").classList.remove("on");

function abreCanal(cod){
  if(!cod||!window.Sala) return;
  const luzEl=$("#luzSala");
  canal=Sala.conectar({
    sala:cod,
    alEstado(e){
      luzEl.className="luzSala "+(e==="conectado"?"ok":(e==="sin-red"?"":"busca"));
      // si el canal se cayó y volvió, hay que presentarse otra vez: la
      // computadora contesta con la escena en la que va la clase
      if(e==="conectado"){ if(huboCaida){ huboCaida=false; setTimeout(saluda,400); } }
      else if(e==="buscando") huboCaida=true;
    },
    alRecibir(m){
      if(m.t==="escena"&&typeof m.n==="number"&&m.n!==ultimaEscena){
        ultimaEscena=m.n; if(m.n!==S.escena) ir(m.n);
      }
      if(m.t==="quien") saluda();
      if(m.t==="credo"&&typeof m.i==="number") avisaPedazo(m.i);
      if(m.t==="salaLuz"&&typeof m.p==="number"){ luzSala=m.p; ultimaSalaLuz=Date.now(); }
    }
  });
  saluda();
  canal.recuperar(45,(msgs)=>{
    // la historia llega por su propio pedido y puede contestar DESPUES de que ya
    // entro una escena en vivo: sin este freno, el telefono retrocede a una
    // escena vieja justo cuando la clase avanzo, y se queda sin sus botones
    if(ultimaEscena>=0) return;
    for(let k=msgs.length-1;k>=0;k--){
      if(msgs[k].t==="escena"&&typeof msgs[k].n==="number"){
        if(S.escena===0&&msgs[k].n>0){ ultimaEscena=msgs[k].n; ir(msgs[k].n); }
        break;
      }
    }
  });
}
/* Si el enlace no trae código, se le pregunta la sala al servidor: así lo que
   se reparte es la dirección pelada de la computadora, sin nada pegado. */
(function conecta(){
  const guardado=()=>{ try{ return localStorage.getItem("imperio-sala"); }catch(e){ return null; } };
  const delEnlace=codigoDelEnlace();
  if(delEnlace){ abreCanal(delEnlace); return; }
  if(location.protocol==="file:") return;
  let listo=false;
  const corta=setTimeout(()=>{ if(!listo){ listo=true; abreCanal(guardado()); } },2000);
  fetch(location.origin+"/sala/ping",{cache:"no-store"})
    .then(r=>r.ok?r.json():null)
    .then(j=>{
      if(listo) return; listo=true; clearTimeout(corta);
      if(j&&j.codigo){ try{ localStorage.setItem("imperio-sala",j.codigo); }catch(e){} }
      abreCanal((j&&j.codigo)||guardado());
    })
    .catch(()=>{ if(!listo){ listo=true; clearTimeout(corta); abreCanal(guardado()); } });
})();

/* ── arranque ───────────────────────────────────────────────────── */
/* A propósito no hay forma de avanzar desde el teléfono: la presentación la
   maneja la computadora. Las flechas quedan sólo para las pruebas en laptop. */
addEventListener("keydown",e=>{
  if(!/[?&]prueba=1/.test(location.search)) return;
  if(e.key==="ArrowRight") ir(S.escena+1);
  if(e.key==="ArrowLeft") ir(S.escena-1);
});
Escenas.cargar(()=>{
  const p=Escenas.sprites().catalogo[S.persona];
  $("#perNombre").textContent=p.nombre;
  $("#perLugar").textContent=p.lugar+" · "+p.ano;
  $("#pedN").textContent="Pedazo "+(S.pedazo+1)+" de "+CREDO.length;
  $("#pedTxt").textContent=CREDO[S.pedazo];
  ir(S.escena||0);
});
requestAnimationFrame(pintaLatido);
</script>
